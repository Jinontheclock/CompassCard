<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Compass — concept demo</title>
    <!-- FF Meta, served from the Adobe Fonts kit. The font files are
         licensed and are never committed here; the kit has to list every
         domain the demo is served from (the portfolio host, and localhost
         for development) or it will quietly fall back to the system font. -->
    <link rel="stylesheet" href="https://use.typekit.net/aqa6xjt.css" />
    <!-- installable: the manifest and icons let a phone keep the demo on its
         home screen and open it full-bleed, the way the app is meant to sit -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
